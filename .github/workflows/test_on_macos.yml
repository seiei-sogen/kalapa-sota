name: macOS で cargo test を回す

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じ PR に push を重ねたら、古い実行を止める。main の実行は止めない。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run_cargo_test_on_macos:
    name: macOS で cargo test を実行する
    runs-on: macos-latest
    # 20 分を超えたら、issue #14 の基準で不合格として ~/.cargo と target のキャッシュを足す。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: ランナーのアーキテクチャと、Xcode、git、rustc のバージョンを出す
        run: |
          echo "runner: $RUNNER_NAME ($RUNNER_OS $RUNNER_ARCH, $ImageOS $ImageVersion)"
          uname -a
          sw_vers
          xcodebuild -version
          git --version
          rustc --version
          cargo --version
      - name: cargo test を実行する
        run: cargo test --locked
